<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:#f9f6ed;color:#2c2924;font-family:"Times New Roman",Times,serif;text-align:center;overflow:hidden}
  body.opened{overflow:auto}
  .justforfun{position:fixed;bottom:12px;right:12px;z-index:120;background:#2c2924;color:#f9f6ed;font-size:11px;letter-spacing:.12em;padding:7px 12px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .6s ease}body.opened .justforfun{opacity:1;pointer-events:auto}
  #musicBtn{
  position:fixed; bottom:12px; left:12px; z-index:120;
  background:#f9f6ed; color:#2c2924; border:1px solid #2c2924;
  padding:7px 14px; border-radius:999px; font-size:12px; cursor:pointer;
}
  .overlay{position:fixed;inset:0;z-index:100;background:#f9f6ed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px 16px;transition:opacity .9s ease, transform .9s ease}
  .overlay.hide{opacity:0;transform:translateY(-30px);pointer-events:none}
  .kat-title{display:flex;align-items:center;gap:22px;font-size:32px;letter-spacing:.15em}
  .cross{width:26px;height:26px;position:relative}
  .cross span{position:absolute;left:50%;top:0;width:1px;height:26px;background:#2c2924;transform:translateX(-50%) rotate(0deg)}
  .two-col{display:flex;gap:12px;width:min(360px,88vw)}
  .two-col .col{flex:1;display:flex;flex-direction:column;gap:10px}
  .col-label{text-align:center;font-size:12px;letter-spacing:.2em;color:#898679}
  .flip{aspect-ratio:400/468;perspective:800px}
  .flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s ease}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .flip-front,.flip-back{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;border-radius:8px;overflow:hidden}
  .flip-front{background:#e8e2d4;font-size:44px}
  .flip-back{transform:rotateY(180deg);background:#000}
  .flip-back img{width:100%;height:100%;object-fit:cover;display:block}
  .countdown{display:flex;gap:24px;justify-content:center;font-size:36px}
  .countdown div{display:flex;flex-direction:column}
  .countdown small{font-size:11px;color:#898679;margin-top:6px;letter-spacing:.08em}
  .view-site{background:#2c2924;color:#f9f6ed;border:0;padding:14px 30px;border-radius:999px;font-size:15px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s ease}
  .view-site.show{opacity:1;pointer-events:auto}
  .page{max-width:820px;margin:0 auto;text-align:left}
  .topbar{position:fixed;top:16px;left:18px;z-index:90;font-size:18px;letter-spacing:.08em;text-align:left;line-height:1.45;opacity:0;transition:opacity .6s;font-weight:600}
  body.opened .topbar{opacity:1}
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:60px 20px 20px;position:relative}
  .hero-title{display:flex;align-items:center;gap:22px;font-size:36px;letter-spacing:.12em}
  .hero-cross{width:26px;height:26px;position:relative}
  .hero-cross span{position:absolute;left:50%;top:0;width:1px;height:26px;background:#2c2924;transform:translateX(-50%) rotate(90deg)}
  .hero-sub{font-size:13px;color:#898679;letter-spacing:.1em}
  .scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:11px;color:#898679;letter-spacing:.15em;display:flex;flex-direction:column;align-items:center;gap:6px}
  .scroll-hint i{font-style:normal;animation:bounce 1.6s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
  .divider{height:1px;background:#c9c2b0;margin:0}
  .live{text-align:center;padding:48px 20px 44px}
  .live h1{font-size:28px;letter-spacing:.08em}
  .live h2{font-size:19px;margin-top:16px;letter-spacing:.1em}
  .live p{margin-top:8px}
  .profile{padding:56px 20px 60px;max-width:1080px;margin:0 auto;text-align:center}
  .profile-title{text-align:left;font-size:52px;letter-spacing:.02em;font-weight:400;line-height:1;margin:0 0 42px}
  .group-photo-wrap{display:flex;justify-content:center;margin:0 auto 58px}
  .group-photo{width:min(540px,88vw);aspect-ratio:1/1;object-fit:cover;display:block;background:#ddd}
  .profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:52px 28px}
  .profile-item{text-align:center}
  .profile-item .pname{font-size:19px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 18px;line-height:1.4}
  .profile-item .plinks{display:flex;gap:20px;justify-content:center}
  .profile-item .plinks a{color:#2c2924;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}
  .plinks a{color:#2c2924;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid #c9c2b0;border-radius:50%}
  
  .footer{margin:40px 20px 40px;border-top:1px solid #898679;padding-top:20px;display:flex;align-items:center;gap:6px;font-size:15px;flex-wrap:wrap}
  .footer img{width:220px;max-width:70vw;height:auto;display:block}.email-text{font-size:16px;letter-spacing:.02em;-webkit-user-select:none;user-select:none}
  .protect{-webkit-user-select:none;user-select:none}
  @media(max-width:560px){
  .profile-title{font-size:40px;margin-bottom:28px}
  .group-photo-wrap{margin-bottom:40px}
  .profile-grid{grid-template-columns:1fr;gap:36px}
  .profile-item .pname{font-size:17px}

  .kat-title,.hero-title{font-size:24px}
  .profile-two{flex-direction:column}
  .overlay{justify-content:flex-start; overflow-y:auto; gap:10px; padding:12px 16px 20px}
  .two-col{gap:8px}
  .countdown{gap:16px; font-size:28px}
}
</style>

let musicStarted = false;
function tryStartMusic(){ if(musicStarted) return; musicStarted = true; bgm.play().catch(()=>{}); musicBtn.textContent = '🎉'; }
document.addEventListener('pointerdown', tryStartMusic);
document.addEventListener('touchstart', tryStartMusic);
musicBtn.addEventListener('click', () => { if (bgm.paused) { bgm.play(); musicBtn.textContent = '🎉'; } else { bgm.pause(); musicBtn.textContent = '🎁'; } });
